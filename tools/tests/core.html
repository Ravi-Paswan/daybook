<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook · core tests</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fb; --surface: #fff; --border: #e5e7ef; --text: #111827; --text-2: #4b5563; --text-3: #9ca3af;
    --pass: #059669; --fail: #dc2626; --primary: #4f46e5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #0b0d13; --surface: #141824; --border: #262c3d; --text: #eef0f6; --text-2: #a8b0c2;
            --text-3: #6b7387; --pass: #34d399; --fail: #f87171; --primary: #818cf8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: #fff; display: grid; place-items: center;
          font-weight: 700; font-size: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); font-size: 13px; }
  .summary { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600;
          font-variant-numeric: tabular-nums; }
  .pill.pass { color: var(--pass); } .pill.fail { color: var(--fail); }
  .bar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 0 0 24px; }
  .bar > i { display: block; height: 100%; background: var(--pass); width: 0; transition: width .2s ease-out; }
  .bar.has-fail > i { background: var(--fail); }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 0; padding: 12px 16px;
               border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  section h2 span { font-variant-numeric: tabular-nums; color: var(--text-3); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 16px; border-top: 1px solid var(--border); display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: start; }
  li:first-child { border-top: 0; }
  li .ok { color: var(--pass); font-weight: 700; } li .bad { color: var(--fail); font-weight: 700; }
  li .ms { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  li pre { grid-column: 2 / -1; margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--fail);
           font: 12px/1.5 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }
  .running { color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">D</div>
    <div>
      <h1>Daybook core tests</h1>
      <div class="sub">db · bus · settings · dates · format · metrics · backup · trade calc — real modules, fresh IndexedDB</div>
    </div>
    <div class="summary" id="summary"><span class="pill running">Running…</span></div>
  </header>
  <div class="bar" id="bar"><i></i></div>
  <div id="results"></div>
</div>
<script type="module" src="./core.test.js"></script>
</body>
</html>

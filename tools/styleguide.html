<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook · UI kit</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <script>
    // ?theme=light|dark (or the last choice) before first paint.
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q || sessionStorage.getItem('daybook.sg.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* Style-guide-only layout (not part of the app). */
    body { background: var(--bg); }
    .sg-top {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--s-4) 10px;
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .sg-brand { display: flex; align-items: center; gap: 10px; font-weight: 720; letter-spacing: -0.015em; font-size: var(--fs-lg); }
    .sg-brand .brand-mark { width: 30px; height: 30px; }
    .sg-brand small { font-weight: 550; color: var(--text-3); font-size: var(--fs-sm); letter-spacing: 0; }
    .sg-top .spacer { min-width: 8px; }
    .sg-main { padding: var(--s-6) var(--s-4) 120px; }
    .sg-main > .page { gap: var(--s-8); }
    .sg-jump { margin-top: var(--s-2); }
    .sg-group { scroll-margin-top: 84px; }
    .sg-group > .section-title { font-size: var(--fs-xl); }
    .sg-label { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 0 0 var(--s-2); }
    .sg-demo { display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
    .sg-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--s-3); }
    .sg-swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .sg-chip { height: 56px; border-radius: var(--r); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .sg-swatch code { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sg-type > * { margin: 0; }
    .sg-type { display: grid; gap: 10px; }
    .sg-type .row-between { align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .sg-type code { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); }
    .sg-boxes { display: flex; flex-wrap: wrap; gap: var(--s-4); }
    .sg-box { width: 96px; height: 72px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-2); font-family: var(--font-mono); }
    .sg-space { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .sg-space span { display: block; background: var(--primary-soft); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); border-radius: 4px; }
    .sg-space figure { margin: 0; display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
    .sg-accents { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s-3); }
    .sg-accent { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); font-weight: 600; font-size: var(--fs-sm); }
    .sg-accent small { display: block; font-weight: 500; color: var(--text-3); font-family: var(--font-mono); font-size: 11px; }
  </style>
</head>
<body>
  <header class="sg-top">
    <div class="sg-brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 512 512" aria-hidden="true"><g fill="#fff"><path d="M176 250a80 80 0 0 1 160 0z"/><rect x="112" y="273" width="288" height="34" rx="17"/></g><path d="M256 144V100M334.77 179.07l32.7-29.44M177.23 179.07l-32.7-29.44" stroke="#fff" stroke-width="30" stroke-linecap="round"/><rect x="112" y="332" width="218" height="28" rx="14" fill="#fff" opacity=".8"/><rect x="112" y="384" width="138" height="28" rx="14" fill="#fff" opacity=".55"/></svg></span>
      <span>Daybook <small>UI kit</small></span>
    </div>
    <div class="spacer"></div>
    <div id="sg-theme"></div>
  </header>
  <main class="sg-main" id="sg-main" tabindex="-1">
    <p class="muted">Loading the UI kit…</p>
  </main>
  <script type="module" src="styleguide.js"></script>
</body>
</html>
